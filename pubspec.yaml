name: water_buddy
description: A modern AI-powered hydration tracker.
publish_to: 'none'
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.4.0
  firebase_core: ^2.20.0
  firebase_auth: ^4.5.0
  cloud_firestore: ^4.12.0
  google_sign_in: ^6.1.0
  flutter_local_notifications: ^14.0.0
  rive: ^0.11.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
